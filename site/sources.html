<link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./portal.css"><link rel="stylesheet" href="./manage.css"></head><body class="workspace-body">
<div class="workspace-shell"><aside class="workspace-nav"><a class="brand portal-brand" href="./index.html"><div class="brand-mark">ع</div><div><strong>عَزْو</strong><span>تأصيل المعرفة</span></div></a>

<main class="workspace-main"><header class="workspace-top"><div><span class="overline">سجل المعرفة</span><h1>المصادر</h1><p class="muted">مصادر وقفية عامة + مصادر خاصة بالمؤسسة، مع حالة اعتماد وترخيص وإصدار.</p></div><button class="primary-btn" id="newSourceBtn">+ إضافة مصدر</button></header>
<section class="source-tabs"><button class="active" data-filter="all">الكل</button><button data-filter="public">وقفية عامة</button><button data-filter="org">خاصة بالمؤسسة</button></section>
<section id="sourcesGrid" class="sources-grid"></section>
<dialog id="sourceDialog" class="azwo-dialog"><form method="dialog" id="sourceForm"><div class="dialog-head"><div><span class="overline">مصدر جديد</span><h2>إضافة مصدر</h2></div><button value="cancel" class="dialog-close">×</button></div>
<label>اسم المصدر<input id="sourceTitle" required placeholder="مثال: مصدر معرفي معتمد"></label>
<div class="two-cols"><label>النوع<select id="sourceType"><option>قرآن</option><option>حديث</option><option>تفسير</option><option>فقه</option><option>لغة</option><option>مرجع عام</option></select></label><label>النطاق<select id="sourceScope"><option value="org">خاص بالمؤسسة</option><option value="public">وقفي عام</option></select></label></div>
<label>الرابط<input id="sourceUrl" type="url" placeholder="https://..."></label><label>الترخيص<input id="sourceLicense" placeholder="اسم الترخيص أو شروط الاستخدام"></label>
<div class="dialog-actions"><button value="cancel" class="secondary-btn">إلغاء</button><button id="saveSource" value="default" class="primary-btn">حفظ المصدر</button></div></form></dialog>
</main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./data-client.js"></script><script src="./manage.js"></script></body></html>
